[package]
name = "podium"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
quick-xml   = "0.37"
regex       = "1"
serde_json  = "1"
thiserror   = "2"
tokio       = { version = "1", features = ["process", "time", "rt", "fs", "net"] }
tonic       = "0.13"
prost       = "0.13"

[build-dependencies]
tonic-build          = "0.13"
protoc-bin-vendored  = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }

[features]
mock        = []
integration = []
