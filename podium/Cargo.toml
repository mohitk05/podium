[package]
name = "podium-driver"
version = "0.0.14"
edition = "2021"
description = "Async Rust library for driving Android devices in tests via Maestro's gRPC server"
license = "Apache-2.0"
repository = "https://github.com/mohitk05/podium"
readme = "../README.md"
exclude = ["../vendor/*"]

[lib]
name = "podium"

[dependencies]
async-trait = "0.1"
quick-xml   = "0.37"
regex       = "1"
serde_json  = "1"
thiserror   = "2"
tokio       = { version = "1", features = ["process", "time", "rt", "fs", "net"] }
tonic       = "0.13"
prost       = "0.13"

[build-dependencies]
tonic-build          = "0.13"
protoc-bin-vendored  = "3"
reqwest              = { version = "0.12", features = ["blocking"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }

[features]
mock        = []
integration = []
