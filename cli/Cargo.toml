[package]
name = "podium"
version = "0.1.0"
edition = "2021"

[dependencies]
podium-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
reqwest = { version = "0.12", features = ["blocking", "multipart", "json", "native-tls"] }
