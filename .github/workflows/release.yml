name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  apks:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android SDK (NDK)
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build APKs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: bash scripts/build-runner.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            android/runner/build/outputs/apk/androidTest/debug/runner-debug-androidTest.apk
            android/sampleapp/build/outputs/apk/debug/sampleapp-debug.apk

  cli:
    name: Build CLI (${{ matrix.target }})
    needs: apks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: podium-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: podium-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: podium-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Download APKs artifact
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: apk-dist/

      - name: Stage APKs for embedding
        run: |
          mkdir -p cli/apks
          cp apk-dist/android/runner/build/outputs/apk/androidTest/debug/runner-debug-androidTest.apk cli/apks/runner.apk
          cp apk-dist/android/sampleapp/build/outputs/apk/debug/sampleapp-debug.apk cli/apks/sampleapp.apk

      - name: Build CLI (with embedded APKs)
        run: cargo build --release -p podium --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/podium ${{ matrix.artifact }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: [apks, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/apks/android/runner/build/outputs/apk/androidTest/debug/runner-debug-androidTest.apk
            dist/apks/android/sampleapp/build/outputs/apk/debug/sampleapp-debug.apk
            dist/podium-linux-x86_64/podium-linux-x86_64
            dist/podium-macos-aarch64/podium-macos-aarch64
            dist/podium-macos-x86_64/podium-macos-x86_64
